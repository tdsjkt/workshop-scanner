<!DOCTYPE html>
<html>

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Workshop Check-in</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <style>

    body {

      font-family: Arial, sans-serif;

      max-width: 500px;

      margin: 0 auto;

      padding: 20px;

      background: #f5f5f5;

    }


    h1 {

      text-align: center;

      margin-bottom: 25px;

    }


    input,
    select,
    button {

      width: 100%;

      box-sizing: border-box;

      padding: 14px;

      margin-bottom: 12px;

      font-size: 16px;

      border-radius: 8px;

      border: 1px solid #ccc;

    }


    button {

      background: #111;

      color: white;

      border: none;

      font-weight: bold;

    }


    #reader {

      width: 100%;

      margin-top: 15px;

      background: white;

      border-radius: 10px;

      overflow: hidden;

    }


    #result {

      margin-top: 15px;

      padding: 15px;

      text-align: center;

      border-radius: 8px;

      background: white;

      font-weight: bold;

    }


    .success {

      background: #d4edda !important;

      color: #155724;

    }


    .error {

      background: #f8d7da !important;

      color: #721c24;

    }


    .loading {

      color: #666;

    }

  </style>

</head>


<body>


<h1>Workshop Check-in</h1>


<input
  id="admin"
  type="text"
  placeholder="Admin name"
/>


<select id="workshop">

  <option value="">
    Loading workshops...
  </option>

</select>


<button onclick="startScanner()">

  START SCANNER

</button>


<div id="reader"></div>


<div
  id="result"
  class="loading"
>

  Loading workshops...

</div>


<script>


// =====================================================
// APPS SCRIPT URL
// =====================================================

const API_URL =
  "https://script.google.com/a/macros/tripledotstudios.com/s/AKfycbyyRVmPjI2a6U4_dwfHSp-XslXDEye3EX7LmuYGYfPqePnUW6CoGjqQOaBwl6t2vuQW/exec";


// =====================================================
// JSONP REQUEST
// =====================================================

function jsonp(
  url,
  callback
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  window[callbackName] =
    function(data) {

      delete window[callbackName];

      script.remove();

      callback(data);

    };


  const script =
    document.createElement("script");


  script.src =
    url +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      callback({

        success: false,

        status: "ERROR",

        message:
          "Could not connect to server."

      });

    };


  document
    .body
    .appendChild(script);

}


// =====================================================
// LOAD WORKSHOPS
// =====================================================

function loadWorkshops() {

  const dropdown =
    document.getElementById(
      "workshop"
    );


  const result =
    document.getElementById(
      "result"
    );


  const url =
    API_URL +
    "?action=workshops";


  jsonp(
    url,
    function(data) {


      console.log(
        "Workshop response:",
        data
      );


      if (
        !data ||
        !data.workshops
      ) {

        dropdown.innerHTML =
          '<option value="">Unable to load workshops</option>';


        result.className =
          "error";


        result.innerHTML =
          "Unable to load workshops.";

        return;

      }


      dropdown.innerHTML =
        '<option value="">Select workshop</option>';


      data.workshops.forEach(
        function(workshop) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            workshop.id;


          option.textContent =
            workshop.name +
            " (" +
            workshop.capacity +
            " pax)";


          dropdown.appendChild(
            option
          );

        }
      );


      result.className = "";

      result.innerHTML =
        "Select a workshop and start scanning";

    }
  );

}


// =====================================================
// SCANNER
// =====================================================

let scanner = null;

let scannerRunning = false;

let processing = false;


// =====================================================
// START SCANNER
// =====================================================

async function startScanner() {

  const admin =
    document
      .getElementById("admin")
      .value
      .trim();


  const workshop =
    document
      .getElementById("workshop")
      .value;


  if (!admin) {

    alert(
      "Please enter admin name."
    );

    return;

  }


  if (!workshop) {

    alert(
      "Please select a workshop."
    );

    return;

  }


  if (scannerRunning) {
    return;
  }


  const result =
    document.getElementById(
      "result"
    );


  result.className = "";

  result.innerHTML =
    "Opening camera...";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No camera found."
      );

    }


    let cameraId =
      cameras[0].id;


    // Prefer rear camera

    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        (
          cameras[i].label ||
          ""
        ).toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        cameraId =
          cameras[i].id;

        break;

      }

    }


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        }

      },

      onScanSuccess,

      function() {}

    );


    scannerRunning = true;


    result.className = "";


    result.innerHTML =
      "Camera ready — scan participant QR";


  } catch (error) {

    console.error(error);


    result.className =
      "error";


    result.innerHTML =
      "Unable to open camera.<br><br>" +
      error.message;

  }

}


// =====================================================
// QR SCANNED
// =====================================================

function onScanSuccess(
  decodedText
) {

  if (processing) {
    return;
  }


  processing = true;


  const admin =
    document
      .getElementById("admin")
      .value
      .trim();


  const workshop =
    document
      .getElementById("workshop")
      .value;


  const result =
    document.getElementById(
      "result"
    );


  result.className = "";


  result.innerHTML =
    "Checking QR...";


  const url =
    API_URL +
    "?action=checkin" +
    "&qr=" +
    encodeURIComponent(
      decodedText
    ) +
    "&workshop=" +
    encodeURIComponent(
      workshop
    ) +
    "&admin=" +
    encodeURIComponent(
      admin
    );


  jsonp(
    url,
    function(data) {

      console.log(
        "Check-in response:",
        data
      );


      if (
        data.status ===
        "APPROVED"
      ) {

        result.className =
          "success";


        result.innerHTML =
          "✓ CHECK-IN SUCCESSFUL" +
          "<br><br>" +
          data.name;

      }


      else if (
        data.status ===
        "ALREADY CHECKED IN"
      ) {

        result.className =
          "error";


        result.innerHTML =
          "✕ ALREADY CHECKED IN" +
          "<br><br>" +
          data.message;

      }


      else {

        result.className =
          "error";


        result.innerHTML =
          "✕ " +
          (
            data.status ||
            "ERROR"
          ) +
          "<br><br>" +
          (
            data.message ||
            "Check-in failed."
          );

      }


      setTimeout(
        function() {

          processing = false;

        },
        2500
      );

    }
  );

}


// =====================================================
// LOAD WORKSHOPS
// =====================================================

loadWorkshops();


</script>


</body>

</html>
